name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vatix
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vatix

      - name: Check code formatting
        run: pnpm format:check

      - name: Check TypeScript (src)
        run: pnpm tsc --noEmit

      - name: Check TypeScript (apps + packages)
        run: pnpm tsc --noEmit -p apps/tsconfig.json

      - name: Check TypeScript (packages)
        run: pnpm tsc --noEmit -p packages/tsconfig.json

      - name: Create shadow database
        run: psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE vatix_shadow;"

      - name: Validate migrations
        run: pnpm prisma:validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vatix
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vatix_shadow

      - name: Run migrations
        run: pnpm prisma:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vatix

      - name: Run unit tests (with coverage)
        run: pnpm exec vitest run --exclude 'tests/integration/**' --exclude '**/*.integration.test.ts' --coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vatix
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          ADMIN_TOKEN: test-admin-token
          MATCHING_LEASE_ENFORCED: "false"

      - name: Run integration tests (lease disabled)
        run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vatix
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          ADMIN_TOKEN: test-admin-token
          MATCHING_LEASE_ENFORCED: "false"

      - name: Run integration tests (lease enforced)
        run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vatix
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          ADMIN_TOKEN: test-admin-token
          MATCHING_LEASE_ENFORCED: "true"

      - name: Build
        run: pnpm build
