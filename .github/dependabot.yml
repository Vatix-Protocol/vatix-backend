version: 2
updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    reviewers:
      - "Mimah97"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # Allow updates to stellar-sdk
    allow:
      - dependency-type: "all"
    # Group updates by type
    groups:
      stellar-sdk:
        patterns:
          - "@stellar/stellar-sdk"
        update-types:
          - "minor"
          - "patch"
      production:
        dependency-type: "production"
        exclude-patterns:
          - "@stellar/stellar-sdk"
      development:
        dependency-type: "development"
